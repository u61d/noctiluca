# colours are in noctiluca-colors.conf (noctiluca-theme writes it)
include noctiluca-colors.conf

# icons come from the nerd symbols font so plex can stay unpatched
font_family       IBM Plex Mono
bold_font         IBM Plex Mono SemiBold
italic_font       IBM Plex Mono Italic
bold_italic_font  IBM Plex Mono SemiBold Italic
font_size         11.0
modify_font       cell_height 118%
disable_ligatures always
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

background_opacity         0.90
dynamic_background_opacity yes
window_padding_width       14 18
placement_strategy         top-left
hide_window_decorations    yes
confirm_os_window_close    0

cursor_shape                 beam
cursor_beam_thickness        1.6
cursor_blink_interval        0.6
cursor_stop_blinking_after   8
cursor_trail                 3
cursor_trail_decay           0.08 0.3
cursor_trail_start_threshold 3

enable_audio_bell     no
visual_bell_duration  0
mouse_hide_wait       3.0
url_style             curly
detect_urls           yes
strip_trailing_spaces smart

repaint_delay    6
input_delay      2
sync_to_monitor  yes

scrollback_lines        20000
tab_bar_min_tabs        2
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}  {title} "
active_tab_font_style   bold
inactive_tab_font_style normal
# no-cursor keeps the beam
shell_integration       enabled no-cursor
allow_remote_control    no

enabled_layouts splits, stack
map ctrl+shift+enter     launch --location=split --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+alt+z           toggle_layout stack
map ctrl+shift+t         new_tab_with_cwd
