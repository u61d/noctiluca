name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb shellcheck glslang-tools ffmpeg fonts-ibm-plex \
            libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python packages
        run: pip install pyside6==6.12.0 pillow

      # ubuntu doesn't have lua 5.5 yet
      - name: Lua 5.5
        run: |
          git clone https://github.com/lua/lua.git /tmp/lua
          git -C /tmp/lua checkout a5522f0
          make -C /tmp/lua -s
          /tmp/lua/lua -v

      - name: Hyprland v0.56.2 stubs
        run: git clone --depth 1 --branch v0.56.2 https://github.com/hyprwm/Hyprland.git /tmp/hyprland

      - name: tests/lint.sh
        run: LUA=/tmp/lua/lua HL_STUBS=/tmp/hyprland/meta/hl.meta.lua bash tests/lint.sh
